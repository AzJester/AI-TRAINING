name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, unit, browser, and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            dist/playwright-report
            dist/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production server
        run: node node_modules/vinext/dist/cli.js start --hostname 127.0.0.1 --port 4173 > /tmp/ai-practice-lab.log 2>&1 &
      - name: Wait for production server
        run: curl --retry 30 --retry-connrefused --retry-delay 2 --max-time 5 http://127.0.0.1:4173/
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/workflows/lighthouserc.cjs
          uploadArtifacts: true
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-server-log
          path: /tmp/ai-practice-lab.log
          if-no-files-found: ignore
          retention-days: 7
